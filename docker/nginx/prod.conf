server {
    listen 80;

    server_name agsoy-elementary-school.southeastasia.cloudapp.azure.com 4.194.232.122;

    client_max_body_size 100M;

    # -------------------------
    # FRONTEND (Next.js)
    # -------------------------
    location / {
        proxy_pass http://frontend:3000;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }

    # -------------------------
    # LARAVEL (API ONLY) via PHP-FPM
    # -------------------------

    # Pass /api/ PHP requests to PHP-FPM
    location ~ ^/(api|sanctum)(/.*)?$ {
        root /var/www/public;  # ← your Laravel /public path inside the container

        # Rewrite to index.php (Laravel's front controller)
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Handle all .php files via FastCGI
    location ~ \.php$ {
        root /var/www/public;  # ← must match above

        fastcgi_pass backend:9000;  # PHP-FPM container

        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;

        include fastcgi_params;

        fastcgi_param HTTP_HOST $host;
        fastcgi_param HTTPS off;  # change to "on" if using SSL termination
    }
}
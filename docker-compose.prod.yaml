services:
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx/prod.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - frontend
      - backend
    restart: always

  frontend:
    build:
      context: ../cs12-nextjs
      dockerfile: docker/nextjs/prod/Dockerfile
      args:
        NEXT_PUBLIC_BACKEND_URL: http://agsoy-elementary-school.southeastasia.cloudapp.azure.com
        NEXT_PUBLIC_DOCKER_BACKEND_URL: http://nginx
    expose:
      - "3000"
    environment:
      NODE_ENV: production
      FRONTEND_URL: http://agsoy-elementary-school.southeastasia.cloudapp.azure.com  # ← add this
      INTERNAL_BACKEND_URL: http://nginx # ← runtime, no rebuild needed
    restart: always

  backend:
    build:
      context: .
      dockerfile: docker/prod/Dockerfile
    expose:
      - "9000"
    environment:
      APP_ENV: production
    restart: always
    depends_on:
      - postgres

  postgres:
    image: postgres:17
    restart: always
    environment:
      POSTGRES_DB: cs12_laravel
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: